
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/react-minecraft/plugin
# (The AI model is not included in this project)
#

# Available actions:

# [message] <text> — send a message to the player. Aliases: [msg]
# [actionbar] <text> — show text in the player's action bar. Aliases: [bar]
# [title] <title>;<subtitle> — show a title to the player. Aliases: [show-title]
# [sound] <sound>;<volume>;<pitch> — play a sound for the player. Aliases: [play-sound]
# [broadcast] <text> — send a message to all players. Aliases: [bc]
# [broadcast-actionbar] <text> — show text in every player's action bar. Aliases: [broadcast-bar], [bcbar]
# [broadcast-title] <title>;<subtitle> — show a title to all players. Aliases: [bctitle]
# [console-command] <command> — execute a command as the console. Aliases: [console], [cmd]

# Alert-related actions
alerts:

  # Actions run for every alert. <player> - the player, <check> - the check,
  # <violations> or <vl> - violations, <details> - details from the check
  alert:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#eb2544><player></color> <white>failed <color:#eb2544><check></color> <dark_gray>(x<vl>) <gray><details></gray>"

  # Actions performed when alerts are enabled
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts <color:#11ff11>enabled ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions run when alerts are enabled only for some players. <players> - their names
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts for <color:#eb2544><players></color> <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions performed when alerts are disabled
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts <color:#ff1111>disabled ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts <color:#ff1111>disabled ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react monitor (or /react verbose) - monitoring of every analysis
monitor:

  # Actions run for every analysis, placeholders as in alerts.alert
  message:
    - "[msg] <b><gradient:#747474:#6C6C6C>⚡ ᴍᴏɴɪᴛᴏʀ</gradient></b> <dark_gray>»</dark_gray> <white>Analysis:</white> <color:#747474><player></color> <dark_gray>→</dark_gray> <color:#747474><check></color> <gray><details></gray>"

  # Actions performed when monitoring is enabled
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Analysis monitoring <color:#11ff11>enabled ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Analysis monitoring <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions run when only some players are monitored. <players> - their names
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Monitoring <color:#eb2544><players></color> <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions performed when monitoring is disabled
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Analysis monitoring <color:#ff1111>disabled ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Analysis monitoring <color:#ff1111>disabled ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"


# /react debug [players] [check] - debug lines of the checks, shown by each check's debug actions
debug:

  # Actions performed when debug is enabled
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions run when debug follows some players or one check. <players> - their names, <check> - the check
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug of <color:#eb2544><players></color> <gray>(<check>)</gray> <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions performed when debug is disabled
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug <color:#ff1111>disabled ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react bypass <players> [duration|forever] [check], /react bypass remove <players> [check], /react bypass list
bypass:

  # <players> - the names, <check> - the check, <duration> - how long
  granted:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><players> bypass <check> for <duration>"
    - "[sound] entity.player.levelup;0.7;1.0"

  # <players> - the names, <check> - the check
  removed:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><players> no longer bypass <check>"
    - "[sound] entity.player.levelup;0.7;1.0"

  # Nothing changed for <player>: no such bypass, or an addon cancelled it
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Nothing changed for <white><player>"

  # <count> - how many online players have a bypass
  list-header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Bypasses: <color:#eb2544><count>"

  # <player>, <check>, <duration> - the time left
  list-entry:
    - "[msg]   <dark_gray>•</dark_gray> <white><player> <dark_gray>→</dark_gray> <white><check> <dark_gray>·</dark_gray> <gray><duration>"

  list-empty:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Nobody online has a bypass."

  invalid-check:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Unknown check."
    - "[sound] block.note_block.bass;1.0;0.8"
  invalid-duration:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Enter a duration, such as 10m or 1h, or forever."
    - "[sound] block.note_block.bass;1.0;0.8"
  all-checks: "all checks"
  forever: "forever"

# Plugin reload actions
reload:

  # Actions performed when a reload starts
  on-start:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Reloading the plugin..."
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Reloading..."
    - "[sound] block.note_block.pling;1.0;1.0"

  # Actions performed when a reload finishes
  on-finish:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin reloaded!"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin reloaded successfully!"
    - "[sound] entity.player.levelup;1.0;1.0"

  on-failure:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Reload failed. See the server console."
    - "[sound] block.note_block.bass;1.0;0.8"

# /react reboot
reboot:

  # Before the reboot. <jar> - the plugin file, <version> - its version
  starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Rebooting React from <jar> (<version>)..."
    - "[sound] block.note_block.pling;0.7;1.0"

  # The reboot cannot start. <reason> - why
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Reboot cancelled: <gray><reason>"
    - "[sound] entity.creeper.hurt;1.0;1.0"

  # These three go out while the plugin is unloaded, so they are plain text and not actions.
  # loaded has <old> and <new>, the versions before and after; failed has <reason>
  unloaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin unloaded, loading the new jar..."
  loaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin rebooted: <gray><old> <dark_gray>-></dark_gray> <white><new>"
  failed: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Reboot failed: <gray><reason>"

  # /react reboot <target> for addons and RCPs. <target> - all, rcp, addons or a name
  extensions-starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Rebooting <target>..."
    - "[sound] block.note_block.pling;0.7;1.0"

  # <loaded>, <unloaded>, <failed> - the names, or "-"
  extensions-done:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Extension reboot finished:</white>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Loaded:</gray> <white><loaded>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Unloaded:</gray> <white><unloaded>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Failed:</gray> <color:#ff3655><failed>"
    - "[sound] block.note_block.pling;0.7;1.0"

  # Nothing matched <target>
  extensions-unknown:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>No addon or RCP named <white><target>"
    - "[sound] block.note_block.bass;0.8;0.8"

# /react rcps
rcps:

  # <count> - how many RCPs are loaded
  header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>RCP: <color:#eb2544><count>"

  # One RCP without a status. <name>, <version>, <api> - its API version
  entry:
    - "[msg]   <dark_gray>•</dark_gray> <white><name> <gray>v<version></gray> <dark_gray>·</dark_gray> <gray>API <api>"

  # One RCP with a status. <status> - what it says about itself
  entry-with-status:
    - "[msg]   <dark_gray>•</dark_gray> <white><name> <gray>v<version></gray> <dark_gray>·</dark_gray> <gray>API <api>"
    - "[msg]     <gray>Status:</gray> <white><status>"

  # React RCP updates. <version>, <channel>, <state>, <checked>
  react:
    - "[msg]   <dark_gray>»</dark_gray> <white>React RCP <version> <dark_gray>·</dark_gray> <gray><channel>"
    - "[msg]     <gray>Status:</gray> <white><state> <dark_gray>·</dark_gray> <gray>Checked: <checked>"

# Update notifications, for alert recipients and players with react.notify.update on join
updates:

  # A new plugin jar is in plugins/update and applies on restart. <name>, <version>
  plugin:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>React <color:#eb2544><version></color> is downloaded, it applies on restart"

  # A new addon or RCP jar is staged. <name>, <version>
  extension:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><name> <color:#eb2544><version></color> is downloaded: <click:run_command:'/react reboot <name>'><u>/react reboot <name></u></click>"

# Help and replies to command errors
help:

  # /react with no arguments
  root:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Commands:"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react help</color> <white>Show this help"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react checks</color> <white>List configured checks"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react alerts [players]</color> <white>Toggle alerts"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react monitor [players]</color> <white>Toggle analysis monitoring"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react history [player] [page]</color> <white>View analysis history"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react debug [players] [check]</color> <white>Show check debug lines"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass <players> [time] [check]</color> <white>Grant a bypass"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass remove <players> [check]</color> <white>Remove a bypass"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass list</color> <white>List active bypasses"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react reload</color> <white>Reload configs"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react reboot [target]</color> <white>Reboot plugin or extensions"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react rcps</color> <white>List installed RCPs"

  # No permission for the command
  no-permission:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>You do not have permission."
    - "[sound] block.note_block.bass;0.8;0.8"

  # Unknown command or wrong arguments
  unknown-command:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Unknown command or invalid arguments.</color> <white>Use <click:run_command:'/react'><u>/react</u></click> for help."
    - "[sound] block.note_block.bass;0.8;0.8"

  # Player-only command
  player-only:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Only players can use this command."
    - "[sound] block.note_block.bass;0.8;0.8"

# Texts for the placeholders above and for PlaceholderAPI
texts:

  # %react_model% when no RCP wrote a status
  unavailable: "Unavailable"

  # <version> in /react rcps
  no-version: "-"
  version: "v<version>"

  # <checked> in /react rcps. <minutes> - how many minutes ago
  not-checked: "not checked"
  checked-now: "checked just now"
  checked-ago: "checked <minutes> min ago"
  update-labels:
    release: "stable releases"
    prerelease: "nightly"
    disabled: "disabled"
    installed: "installed"
    offline: "release unavailable"
    rejected: "signature rejected"
    no jar: "no compatible JAR"
    up to date: "up to date"
    staged: "ready to install"
    failed: "update failed"
    not checked: "not checked"
    api-version: "incompatible API <version>"

# Не меняйте / Do not change
config-version: 3
