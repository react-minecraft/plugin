
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#

# Available actions:

# [message] <text> — send a message to the player. Aliases: [msg]
# [actionbar] <text> — show text in the player's action bar. Aliases: [bar]
# [title] <title>;<subtitle> — show a title to the player. Aliases: [show-title]
# [sound] <sound>;<volume>;<pitch> — play a sound for the player. Aliases: [play-sound]
# [broadcast] <text> — send a message to all players. Aliases: [bc]
# [broadcast-actionbar] <text> — show text in every player's action bar. Aliases: [broadcast-bar], [bcbar]
# [broadcast-title] <title>;<subtitle> — show a title to all players. Aliases: [bctitle]
# [console-command] <command> — execute a command as the console. Aliases: [console], [cmd]

# Alert-related actions
alerts:

  # Actions run for every alert. {player} - the player, {check} - the check,
  # {violations} or {vl} - violations, {details} - details from the check
  alert:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#eb2544>{player}</color> <white>провалил <color:#eb2544>{check}</color> <dark_gray>(x{vl}) <gray>{details}</gray>"

  # Actions performed when alerts are enabled
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions run when alerts are enabled only for some players. {players} - their names
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Alerts for <color:#eb2544>{players}</color> <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions performed when alerts are disabled
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react monitor (or /react verbose) - monitoring of every analysis
monitor:

  # Actions run for every analysis, placeholders as in alerts.alert
  message:
    - "[msg] <b><gradient:#747474:#6C6C6C>⚡ ᴍᴏɴɪᴛᴏʀ</gradient></b> <dark_gray>»</dark_gray> <dark_gray>Аналитика: <color:#747474>{player}</color> <dark_gray>-></dark_gray> <color:#747474>{check}</color> <dark_gray>{details}</dark_gray>"

  # Actions performed when monitoring is enabled
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions run when only some players are monitored. {players} - their names
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Monitoring <color:#eb2544>{players}</color> <color:#11ff11>enabled ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Actions performed when monitoring is disabled
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"


# Plugin reload actions
reload:

  # Actions performed when a reload starts
  on-start:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка плагина..."
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка..."
    - "[sound] block.note_block.pling;1.0;1.0"

  # Actions performed when a reload finishes
  on-finish:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин перезагружен!"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин успешно перезагружен!"
    - "[sound] entity.player.levelup;1.0;1.0"

# /react reboot
reboot:

  # Before the reboot. {jar} - the plugin file, {version} - its version
  starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <gray>Rebooting React from <white>{jar}</white> ({version})..."

  # The reboot cannot start. {reason} - why
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Reboot cancelled: <gray>{reason}"
    - "[sound] entity.creeper.hurt;1.0;1.0"

  # These three go out while the plugin is unloaded, so they are plain text and not actions.
  # loaded has {old} and {new}, the versions before and after; failed has {reason}
  unloaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin unloaded, loading the new jar..."
  loaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Plugin rebooted: <gray>{old} <dark_gray>-></dark_gray> <white>{new}"
  failed: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Reboot failed: <gray>{reason}"

# /react rcps
rcps:

  # {count} - how many RCPs are loaded
  header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>RCP: <color:#eb2544>{count}"

  # One RCP without a status. {name}, {version}, {api} - its API version
  entry:
    - "[msg]  <dark_gray>•</dark_gray> <white>{name} <gray>v{version} <dark_gray>|</dark_gray> api {api}"

  # One RCP with a status. {status} - what it says about itself
  entry-with-status:
    - "[msg]  <dark_gray>•</dark_gray> <white>{name} <gray>v{version} <dark_gray>|</dark_gray> api {api} <dark_gray>|</dark_gray> <color:#ff3655>{status}"

  # React RCP updates. {version}, {channel}, {state}, {checked}
  react:
    - "[msg]  <dark_gray>»</dark_gray> <white>React RCP <gray>{version} <dark_gray>|</dark_gray> {channel} <dark_gray>|</dark_gray> {state} <dark_gray>|</dark_gray> {checked}"

# Help and replies to command errors
help:

  # /react with no arguments
  root:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Commands:"
    - "[msg] <color:#eb2544>/react alerts [players]</color> <gray>- alerts, optionally for some players"
    - "[msg] <color:#eb2544>/react monitor [players]</color> <gray>- analysis monitor, optionally for some players"
    - "[msg] <color:#eb2544>/react history <player></color> <gray>- check history"
    - "[msg] <color:#eb2544>/react reload</color> <gray>- reload configs"
    - "[msg] <color:#eb2544>/react reboot</color> <gray>- restart the plugin"
    - "[msg] <color:#eb2544>/react rcps</color> <gray>- installed RCPs"

  # No permission for the command
  no-permission:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>You do not have permission."

  # Unknown command or wrong arguments
  unknown-command:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Unknown command.</color> <gray>List: /react"

  # Player-only command
  player-only:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Only players can use this command."

# Texts for the placeholders above and for PlaceholderAPI
texts:

  # %react_model% when no RCP wrote a status
  unavailable: "Unavailable"

  # {version} in /react rcps
  no-version: "-"
  version: "v{version}"

  # {checked} in /react rcps. {minutes} - how many minutes ago
  not-checked: "not checked"
  checked-now: "checked just now"
  checked-ago: "checked {minutes} min ago"

# Не меняйте / Do not change
config-version: 2
