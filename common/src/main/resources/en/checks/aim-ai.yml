
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#

# Probability threshold above which a player is considered to be cheating
alert:
  threshold: 0.90

# Amount by which VL is reduced when the player is legitimate (after the configured number of rotations)
decay:
  amount: 0.50

# Lines for /react debug viewers. <player> - the player, <check> - the check, <vl> - VL, <details> - the check's message
debug:
  - "[bar] <gray>Aim-AI <dark_gray>»</dark_gray> <white><player></white> <gray><details>"

# Не меняйте / Do not change
config-version: 2
