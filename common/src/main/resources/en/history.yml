
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#

# History settings
history:

  # Aim-AI analysis history
  inference:

    # Message format settings
    format:

      # Number of analysis entries displayed per page
      print-entries: 11

      header:
        - ""
        - " <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <white>AI history</white> <gray>→</gray> <#ff3655><player></#ff3655> <dark_gray>(page <page> / <pages>)"
        - " <gray>➥ Recent analysis sessions"
        - ""
        - " <white>Average cheat probability:</white> <avg-probability>"
        - ""

      empty:
        - " <white>- No entries"

      entry-format:
        - " <gray>•</gray> <white>Check: <check></white> <dark_gray>·</dark_gray> <white>Probability:</white> <probability>"

      footer:
        - ""
        - "  <gradient:#eb2544:#ff3655><prev><hover:show_text:'<white>Previous page'>‹ Previous</hover></prev></gradient> <gray>|</gray> <gradient:#eb2544:#ff3655><next><hover:show_text:'<white>Next page'>Next ›</hover></next></gradient>"

# Не меняйте / Do not change
config-version: 2
