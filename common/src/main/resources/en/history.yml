# History settings
history:

  # Aim-AI analysis history
  inference:

    # Message format settings
    format:

      # Number of analysis entries displayed per page
      print-entries: 11

      header:
        - ""
        - " <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <white>История AI <gray>→</gray> <#ff3655><player> &7(стр. <page> / <pages>)"
        - " <gray>➥ Показатели анализа последних сессий"
        - ""
        - " <white>Средняя вероятность читерства: <avg-probability>"
        - ""

      empty:
        - " <gray>- Пусто..."

      entry-format:
        - " <gray>-</gray> <white>Читерство: <probability>"

      footer:
        - ""
        - "                <gradient:#eb2544:#ff3655><prev><hover:show_text:'<white>Предыдущая страница'>«««««</hover></prev></gradient>       <gray>|       <gradient:#eb2544:#ff3655><next><hover:show_text:'<white>Следующая страница'>»»»»»»</hover></next></gradient>"

# Не меняйте / Do not change
config-version: 2
