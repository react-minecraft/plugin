# History settings
history:

  # Aim-AI analysis history
  inference:

    # Message format settings
    format:

      # Number of analysis entries displayed per page
      print-entries: 11

      header:
        - ""
        - " <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <white>AI history <gray>→</gray> <#ff3655><player> <gray>(page <page> / <pages>)"
        - " <gray>➥ Analysis of recent sessions"
        - ""
        - " <white>Average cheat probability: <avg-probability>"
        - ""

      empty:
        - " <gray>- No entries"

      entry-format:
        - " <gray>-</gray> <white>Cheat probability: <probability>"

      footer:
        - ""
        - "                <gradient:#eb2544:#ff3655><prev><hover:show_text:'<white>Previous page'>«««««</hover></prev></gradient>       <gray>|       <gradient:#eb2544:#ff3655><next><hover:show_text:'<white>Next page'>»»»»»»</hover></next></gradient>"

# Не меняйте / Do not change
config-version: 2
