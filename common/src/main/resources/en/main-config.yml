
#
# React - AI-Powered Anti-Cheat
#
# Plugin source code: https://github.com/g4vrk/React
# (The AI model is not included in this project)
#

# Player settings
player:

  # Check Bedrock players?
  check-bedrock-players: false

  # PvP activity settings
  combat:
    # Number of seconds to analyze rotations after a hit
    time: 2s

# Official addons. Each one is downloaded from its GitHub releases on start when
# download-next-start is true and its jar is not in addons/ yet.
# Updates of installed addons are set in update/addons/<name>.yml
official-addons:
  hologram:
    repository: react-minecraft/hologram-addon
    download-next-start: true
  menu:
    repository: react-minecraft/menu-addon
    download-next-start: true
  punish:
    repository: react-minecraft/punish-addon
    download-next-start: true

# Не меняйте / Do not change
config-version: 4
