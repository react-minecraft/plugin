
#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#

# Действия, вот весь список:

# [message] <текст> — отправить сообщение игроку. Алиасы: [msg]
# [actionbar] <текст> — показать текст в ActionBar игроку. Алиасы: [bar]
# [title] <заголовок>;<подзаголовок> — показать Title игроку. Алиасы: [show-title]
# [sound] <звук>;<громкость>;<тон> — проиграть звук игроку. Алиасы: [play-sound]
# [broadcast] <текст> — отправить сообщение всем игрокам. Алиасы: [bc]
# [broadcast-actionbar] <текст> — показать ActionBar всем игрокам. Алиасы: [broadcast-bar], [bcbar]
# [broadcast-title] <заголовок>;<подзаголовок> — показать Title всем игрокам. Алиасы: [bctitle]
# [console-command] <команда> — выполнить команду от имени консоли. Алиасы: [console], [cmd]

# Действия связанные с оповещениями
alerts:

  # Действия для каждого оповещения. <player> - игрок, <check> - проверка,
  # <violations> или <vl> - нарушения, <details> - подробности от проверки
  alert:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#eb2544><player></color> <white>провалил <color:#eb2544><check></color> <dark_gray>(x<vl>) <gray><details></gray>"

  # Действия при включении оповещений
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия, когда оповещения включены только для некоторых игроков. <players> - их ники
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения по игрокам <color:#eb2544><players></color> <color:#11ff11>включены ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия при выключении оповещений
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react monitor (или /react verbose) - мониторинг каждого анализа
monitor:

  # Действия для каждого анализа, плейсхолдеры как у alerts.alert
  message:
    - "[msg] <b><gradient:#747474:#6C6C6C>⚡ ᴍᴏɴɪᴛᴏʀ</gradient></b> <dark_gray>»</dark_gray> <dark_gray>Аналитика: <color:#747474><player></color> <dark_gray>-></dark_gray> <color:#747474><check></color> <dark_gray><details></dark_gray>"

  # Действия при включении мониторинга
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия, когда мониторинг включён только для некоторых игроков. <players> - их ники
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг игроков <color:#eb2544><players></color> <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия при выключении мониторинга
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# Действия связанные с перезагрузкой плагина
reload:

  # Действия при начале перезагрузки
  on-start:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка плагина..."
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка..."
    - "[sound] block.note_block.pling;1.0;1.0"

  # Действия при окончании перезагрузки
  on-finish:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин перезагружен!"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин успешно перезагружен!"
    - "[sound] entity.player.levelup;1.0;1.0"

# /react reboot
reboot:

  # Перед перезапуском. <jar> - файл плагина, <version> - его версия
  starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <gray>Перезапускаем React из <white><jar></white> (<version>)..."

  # Перезапуск невозможен. <reason> - почему
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Перезапуск отменён: <gray><reason>"
    - "[sound] entity.creeper.hurt;1.0;1.0"

  # Эти три сообщения уходят, пока плагин выгружен, поэтому это просто текст, а не действия.
  # В loaded есть <old> и <new> - версии до и после, в failed есть <reason>
  unloaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин выгружен, загружаем новый jar..."
  loaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин перезапущен: <gray><old> <dark_gray>-></dark_gray> <white><new>"
  failed: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Перезапуск не удался: <gray><reason>"

# /react rcps
rcps:

  # <count> - сколько RCP загружено
  header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>RCP: <color:#eb2544><count>"

  # Одна RCP без статуса. <name>, <version>, <api> - версия API
  entry:
    - "[msg]  <dark_gray>•</dark_gray> <white><name> <gray>v<version> <dark_gray>|</dark_gray> api <api>"

  # Одна RCP со статусом. <status> - что она о себе пишет
  entry-with-status:
    - "[msg]  <dark_gray>•</dark_gray> <white><name> <gray>v<version> <dark_gray>|</dark_gray> api <api> <dark_gray>|</dark_gray> <color:#ff3655><status>"

  # Обновление React RCP. <version>, <channel>, <state>, <checked>
  react:
    - "[msg]  <dark_gray>»</dark_gray> <white>React RCP <gray><version> <dark_gray>|</dark_gray> <channel> <dark_gray>|</dark_gray> <state> <dark_gray>|</dark_gray> <checked>"

# Помощь и ответы на ошибки команд
help:

  # /react без аргументов
  root:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Команды:"
    - "[msg] <color:#eb2544>/react alerts [ники]</color> <gray>- оповещения, можно указать ники"
    - "[msg] <color:#eb2544>/react monitor [ники]</color> <gray>- мониторинг аналитики, можно указать ники"
    - "[msg] <color:#eb2544>/react history <игрок></color> <gray>- история проверок"
    - "[msg] <color:#eb2544>/react reload</color> <gray>- перезагрузить конфиги"
    - "[msg] <color:#eb2544>/react reboot</color> <gray>- перезапустить плагин"
    - "[msg] <color:#eb2544>/react rcps</color> <gray>- установленные RCP"

  # Нет прав на команду
  no-permission:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Недостаточно прав."

  # Неизвестная команда или неверные аргументы
  unknown-command:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Неизвестная команда.</color> <gray>Список: /react"

  # Команда только для игроков
  player-only:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Команда доступна только игрокам."

# Тексты для плейсхолдеров выше и для PlaceholderAPI
texts:

  # %react_model%, когда ни одна RCP не написала статус
  unavailable: "Недоступно"

  # <version> в /react rcps
  no-version: "-"
  version: "v<version>"

  # <checked> в /react rcps. <minutes> - сколько минут назад
  not-checked: "не проверялось"
  checked-now: "проверено только что"
  checked-ago: "проверено <minutes> мин назад"

# Не меняйте / Do not change
config-version: 3
