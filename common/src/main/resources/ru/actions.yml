
#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#

# Действия, вот весь список:

# [message] <текст> — отправить сообщение игроку. Алиасы: [msg]
# [actionbar] <текст> — показать текст в ActionBar игроку. Алиасы: [bar]
# [title] <заголовок>;<подзаголовок> — показать Title игроку. Алиасы: [show-title]
# [sound] <звук>;<громкость>;<тон> — проиграть звук игроку. Алиасы: [play-sound]
# [broadcast] <текст> — отправить сообщение всем игрокам. Алиасы: [bc]
# [broadcast-actionbar] <текст> — показать ActionBar всем игрокам. Алиасы: [broadcast-bar], [bcbar]
# [broadcast-title] <заголовок>;<подзаголовок> — показать Title всем игрокам. Алиасы: [bctitle]
# [console-command] <команда> — выполнить команду от имени консоли. Алиасы: [console], [cmd]

# Действия связанные с оповещениями
alerts:

  # Действия для каждого оповещения. <player> - игрок, <check> - проверка,
  # <violations> или <vl> - нарушения, <details> - подробности от проверки
  alert:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#eb2544><player></color> <white>провалил <color:#eb2544><check></color> <dark_gray>(x<vl>) <gray><details></gray>"

  # Действия при включении оповещений
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#11ff11>включены ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия, когда оповещения включены только для некоторых игроков. <players> - их ники
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения по игрокам <color:#eb2544><players></color> <color:#11ff11>включены ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия при выключении оповещений
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Оповещения <color:#ff1111>выключены ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react monitor (или /react verbose) - мониторинг каждого анализа
monitor:

  # Действия для каждого анализа, плейсхолдеры как у alerts.alert
  message:
    - "[msg] <b><gradient:#747474:#6C6C6C>⚡ ᴍᴏɴɪᴛᴏʀ</gradient></b> <dark_gray>»</dark_gray> <white>Аналитика:</white> <color:#747474><player></color> <dark_gray>→</dark_gray> <color:#747474><check></color> <gray><details></gray>"

  # Действия при включении мониторинга
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия, когда мониторинг включён только для некоторых игроков. <players> - их ники
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг игроков <color:#eb2544><players></color> <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия при выключении мониторинга
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Мониторинг аналитики <color:#ff1111>выключен ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# Действия связанные с перезагрузкой плагина
# /react debug [игроки] [проверка] - debug-строки проверок, их показывают debug-действия каждой проверки
debug:

  # Действия при включении debug
  on-enable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия, когда debug следит за частью игроков или одной проверкой. <players> - их ники, <check> - проверка
  on-enable-players:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug <color:#eb2544><players></color> <gray>(<check>)</gray> <color:#11ff11>включен ✔"
    - "[sound] entity.player.levelup;1.0;1.0"

  # Действия при выключении debug
  on-disable:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Debug <color:#ff1111>выключен ✘"
    - "[sound] entity.creeper.hurt;1.0;1.0"

# /react bypass <игроки> [время|forever] [проверка], /react bypass remove <игроки> [проверка], /react bypass list
bypass:

  # <players> - ники, <check> - проверка, <duration> - на сколько
  granted:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><players> обходят <check> на <duration>"
    - "[sound] entity.player.levelup;0.7;1.0"

  # <players> - ники, <check> - проверка
  removed:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><players> больше не обходят <check>"
    - "[sound] entity.player.levelup;0.7;1.0"

  # Для <player> ничего не изменилось: такого обхода нет или аддон его отменил
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Ничего не изменилось для <white><player>"

  # <count> - сколько игроков онлайн с обходом
  list-header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Обходы: <color:#eb2544><count>"

  # <player>, <check>, <duration> - сколько осталось
  list-entry:
    - "[msg]   <dark_gray>•</dark_gray> <white><player> <dark_gray>→</dark_gray> <white><check> <dark_gray>·</dark_gray> <gray><duration>"

  list-empty:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Ни у кого из игроков онлайн нет обхода."

  invalid-check:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Неизвестная проверка."
    - "[sound] block.note_block.bass;1.0;0.8"
  invalid-duration:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Укажи время, например 10m или 1h, либо forever."
    - "[sound] block.note_block.bass;1.0;0.8"
  all-checks: "все проверки"
  forever: "навсегда"

reload:

  # Действия при начале перезагрузки
  on-start:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка плагина..."
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Начата перезагрузка..."
    - "[sound] block.note_block.pling;1.0;1.0"

  # Действия при окончании перезагрузки
  on-finish:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин перезагружен!"
    - "[bar] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин успешно перезагружен!"
    - "[sound] entity.player.levelup;1.0;1.0"

  on-failure:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Не удалось перезагрузить плагин. Подробности в консоли."
    - "[sound] block.note_block.bass;1.0;0.8"

# /react reboot
reboot:

  # Перед перезапуском. <jar> - файл плагина, <version> - его версия
  starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Перезапускаем React из <jar> (<version>)..."
    - "[sound] block.note_block.pling;0.7;1.0"

  # Перезапуск невозможен. <reason> - почему
  cancelled:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Перезапуск отменён: <gray><reason>"
    - "[sound] entity.creeper.hurt;1.0;1.0"

  # Эти три сообщения уходят, пока плагин выгружен, поэтому это просто текст, а не действия.
  # В loaded есть <old> и <new> - версии до и после, в failed есть <reason>
  unloaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин выгружен, загружаем новый jar..."
  loaded: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Плагин перезапущен: <gray><old> <dark_gray>-></dark_gray> <white><new>"
  failed: "<b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Перезапуск не удался: <gray><reason>"

  # /react reboot <цель> для аддонов и RCP. <target> - all, rcp, addons или имя
  extensions-starting:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Перезапускаем <target>..."
    - "[sound] block.note_block.pling;0.7;1.0"

  # <loaded>, <unloaded>, <failed> - имена или "-"
  extensions-done:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Перезапуск расширений завершён:</white>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Загружены:</gray> <white><loaded>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Выгружены:</gray> <white><unloaded>"
    - "[msg]   <dark_gray>•</dark_gray> <gray>Ошибки:</gray> <color:#ff3655><failed>"
    - "[sound] block.note_block.pling;0.7;1.0"

  # Цель <target> не найдена
  extensions-unknown:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Аддон или RCP с именем <white><target> <color:#ff3655>не найден."
    - "[sound] block.note_block.bass;0.8;0.8"

# /react rcps
rcps:

  # <count> - сколько RCP загружено
  header:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>RCP: <color:#eb2544><count>"

  # Одна RCP без статуса. <name>, <version>, <api> - версия API
  entry:
    - "[msg]   <dark_gray>•</dark_gray> <white><name> <gray>v<version></gray> <dark_gray>·</dark_gray> <gray>API <api>"

  # Одна RCP со статусом. <status> - что она о себе пишет
  entry-with-status:
    - "[msg]   <dark_gray>•</dark_gray> <white><name> <gray>v<version></gray> <dark_gray>·</dark_gray> <gray>API <api>"
    - "[msg]     <gray>Статус:</gray> <white><status>"

  # Обновление React RCP. <version>, <channel>, <state>, <checked>
  react:
    - "[msg]   <dark_gray>»</dark_gray> <white>React RCP <version> <dark_gray>·</dark_gray> <gray><channel>"
    - "[msg]     <gray>Статус:</gray> <white><state> <dark_gray>·</dark_gray> <gray>Проверено: <checked>"

# Уведомления об обновлениях: получателям алертов и игрокам с react.notify.update при входе
updates:

  # Новый jar плагина лежит в plugins/update и применится после рестарта. <name>, <version>
  plugin:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>React <color:#eb2544><version></color> скачан, применится после рестарта"

  # Новый jar аддона или RCP подготовлен. <name>, <version>
  extension:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white><name> <color:#eb2544><version></color> скачан: <click:run_command:'/react reboot <name>'><u>/react reboot <name></u></click>"

# Помощь и ответы на ошибки команд
help:

  # /react без аргументов
  root:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <white>Команды:"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react alerts [игроки]</color> <white>Управление оповещениями"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react monitor [игроки]</color> <white>Мониторинг аналитики"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react history [игрок] [страница]</color> <white>История анализа"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react debug [игроки] [проверка]</color> <white>Отладка проверок"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass <игроки> [время] [проверка]</color> <white>Выдать обход"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass remove <игроки> [проверка]</color> <white>Снять обход"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react bypass list</color> <white>Список обходов"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react reload</color> <white>Перезагрузка конфигов"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react reboot [цель]</color> <white>Перезапуск плагина или расширений"
    - "[msg]   <dark_gray>•</dark_gray> <color:#eb2544>/react rcps</color> <white>Установленные RCP"

  # Нет прав на команду
  no-permission:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Недостаточно прав."
    - "[sound] block.note_block.bass;0.8;0.8"

  # Неизвестная команда или неверные аргументы
  unknown-command:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Неизвестная команда или неверные аргументы.</color> <white>Список: <click:run_command:'/react'><u>/react</u></click>"
    - "[sound] block.note_block.bass;0.8;0.8"

  # Команда только для игроков
  player-only:
    - "[msg] <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <gray>»</gray> <color:#ff3655>Команда доступна только игрокам."
    - "[sound] block.note_block.bass;0.8;0.8"

# Тексты для плейсхолдеров выше и для PlaceholderAPI
texts:

  # %react_model%, когда ни одна RCP не написала статус
  unavailable: "Недоступно"

  # <version> в /react rcps
  no-version: "-"
  version: "v<version>"

  # <checked> в /react rcps. <minutes> - сколько минут назад
  not-checked: "не проверялось"
  checked-now: "проверено только что"
  checked-ago: "проверено <minutes> мин назад"

# Не меняйте / Do not change
config-version: 3
