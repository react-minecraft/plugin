# С какого процента читерства игрок считается нарушителем
alert:
  threshold: 0.90

# На сколько уменьшать VL, если игрок не читерит (После указанного количества поворотов)
decay:
  amount: 0.50

# Строки для /react debug. <player> - игрок, <check> - проверка, <vl> - VL, <details> - сообщение проверки
debug:
  - "[bar] <gray>Aim-AI <dark_gray>»</dark_gray> <white><player></white> <gray><details>"

# Не меняйте / Do not change
config-version: 2
