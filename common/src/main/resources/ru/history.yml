
#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#

# Настройки истории
history:

  # История Aim-AI анализа
  inference:

    # Настройки формата сообщения
    format:

      # Сколько выводиться анализов за 1 раз
      print-entries: 11

      header:
        - ""
        - " <b><gradient:#eb2544:#ff3655>⚡ ʀᴇᴀᴄᴛ</gradient></b> <white>История AI</white> <gray>→</gray> <#ff3655><player></#ff3655> <dark_gray>(стр. <page> / <pages>)"
        - " <gray>➥ Анализы за последние сессии"
        - ""
        - " <white>Средняя вероятность читерства:</white> <avg-probability>"
        - ""

      empty:
        - " <white>- Записей нет"

      entry-format:
        - " <gray>•</gray> <white>Проверка: <check></white> <dark_gray>·</dark_gray> <white>Вероятность:</white> <probability>"

      footer:
        - ""
        - "  <gradient:#eb2544:#ff3655><prev><hover:show_text:'<white>Предыдущая страница'>‹ Назад</hover></prev></gradient> <gray>|</gray> <gradient:#eb2544:#ff3655><next><hover:show_text:'<white>Следующая страница'>Далее ›</hover></next></gradient>"

# Не меняйте / Do not change
config-version: 2
