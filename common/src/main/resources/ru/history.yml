# Настройки истории
history:

  # История Aim-AI анализа
  inference:

    # Настройки формата сообщения
    format:

      # Сколько выводиться анализов за 1 раз
      print-entries: 11

      header:
        - ""
        - " <b><gradient:#ffffff:#9c9c9c>⚡ React</gradient></b> <white>История AI <gray>→</gray> <#d6d6d6>{player} &7(стр. {page:current} / {page:max})"
        - " <gray>➥ Показатели анализа последних сессий"
        - ""
        - " <white>Средняя вероятность читерства: {avg-probability:colored}"
        - ""

      empty:
        - " <gray>- Пусто..."

      entry-format:
        - " <gray>-</gray> <white>Читерство: {probability:colored}"

      footer:
        - ""
        - "                <gradient:#ffffff:#9c9c9c><click:run_command:'/react history {player} {page:previous}'><hover:show_text:'<white>Предыдущая страница'>«««««</hover></click></gradient>       <gray>|       <gradient:#ffffff:#9c9c9c><click:run_command:'/react history {player} {page:next}'><hover:show_text:'<white>Следующая страница'>»»»»»»</hover></click></gradient>"
