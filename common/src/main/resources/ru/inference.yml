#
# React - АнтиЧит основанный на Проверках от Нейросети
#
# Исходный код плагина: https://github.com/g4vrk/React
# (ИИ модель не входит в проект)
#
# Купить доступ к нашей модели -> https://www.react-ac.space/
#

# Включить ИИ сервер?
enabled: true

inference:
  endpoint:
    base-url: 'https://api.react-ac.space'

auth:
  enabled: true
  # Ключ сервера. Команда /react connect <код> сама запишет его сюда,
  # код выдаётся на странице сервера: https://www.react-ac.space/
  value: ВСТАВЬТЕ_ВАШ_КЛЮЧ
  # Для нашей модели не изменяйте: none / bearer / header / query / body
  type: body

client:
  connect-timeout: 10s
  call-timeout: 10s
