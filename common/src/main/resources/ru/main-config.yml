# Настройка оповещений
alerts:

  # Формат оповещений для чата
  format: "<b><gradient:#ffffff:#9c9c9c>⚡ React</gradient></b> <gray>»</gray> <color:#e8e8e8>{player}</color> <white>провалил <color:#e8e8e8>{check}</color> <dark_gray>(x{vl}) <gray>{verbose}</gray>"

# Настройка оповещений для любого анализа
verbose:

  # Формат оповещений для чата
  format: "<b><gradient:#747474:#6C6C6C>⚡ Monitor</gradient></b> <dark_gray>»</dark_gray> <dark_gray>Аналитика: <color:#747474>{player}</color> <dark_gray>-></dark_gray> <color:#747474>{check}</color> <dark_gray>{verbose}</dark_gray>"

# Настройки игроков
player:

  # Проверять ли бедрок игроков?
  check-bedrock-players: false

  # Настройки PvP - Активности
  combat:
    # Сколько секунд после удара, идет анализ поворотов?
    time: 2s

