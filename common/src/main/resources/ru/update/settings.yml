#
# React - обновления
#
# Плагин, RCP и аддоны обновляются из релизов на GitHub.
# Каждый релиз проверяется по SHA-256 и подписи ed25519 React.
#
# У каждого компонента свой файл, он создаётся при первой проверке:
#   update/plugin.yml        - плагин, применяется после рестарта
#   update/rcp/<имя>.yml     - RCP, применяется через /react reboot <имя>
#   update/addons/<имя>.yml  - аддон, применяется через /react reboot <имя>
#

# Как часто проверять обновления (не реже 10m)
interval: 6h

# Перезагружать RCP или аддон сразу после скачивания обновления
auto-reboot: false

# Сообщать получателям алертов и игрокам с react.notify.update о скачанных обновлениях
notify: true

# Не меняйте / Do not change
config-version: 1
